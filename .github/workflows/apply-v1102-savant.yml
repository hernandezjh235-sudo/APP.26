name: Apply Undefeated V1.10.2 Savant Full Profile

on:
  push:
    paths:
      - 'bootstrap_v1102.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install live-refresh dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Build current 2026 Savant installer files
        run: python tools/chatgpt_refresh_savant.py

      - name: Validate and commit the ten refreshed files
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('savant_refresh_output')
          expected=['savant_batter_platoon_2026.csv','savant_batter_platoon_2026.last_good.csv','savant_refresh_manifest.json','savant_batter_profiles.csv','savant_batter_profiles.last_good.csv','savant_pitcher_stats.csv','savant_pitcher_stats.last_good.csv','pitch_mix_matchups.csv','pitch_mix_matchups.last_good.csv','savant_aux_refresh_manifest.json']
          for n in expected:
              p=root/n
              assert p.exists() and p.stat().st_size > 20, n
          for n,minrows in [('savant_batter_platoon_2026.csv',400),('savant_batter_profiles.csv',400),('savant_pitcher_stats.csv',500),('pitch_mix_matchups.csv',1000)]:
              rows=len(pd.read_csv(root/n))
              assert rows >= minrows, (n,rows)
              print(n, rows)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add savant_refresh_output
          git commit -m "Refresh 2026 Baseball Savant installer files"
          git push origin HEAD:main
