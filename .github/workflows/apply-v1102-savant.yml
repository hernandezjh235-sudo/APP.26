name: Temporary Savant Chunk Export

on:
  push:
    paths:
      - 'gzip_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build platoon transfer chunks
        run: |
          test -f savant_refresh_output/savant_batter_platoon_2026.last_good.csv
          gzip -c savant_refresh_output/savant_batter_platoon_2026.last_good.csv > /tmp/platoon.csv.gz
          base64 -w 0 /tmp/platoon.csv.gz > /tmp/platoon.b64
          rm -f savant_refresh_output/platoon_transfer_*
          split -b 8000 -d -a 2 /tmp/platoon.b64 savant_refresh_output/platoon_transfer_
      - name: Commit transfer chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add savant_refresh_output/platoon_transfer_*
          git commit -m "Temporary platoon transfer chunks [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
