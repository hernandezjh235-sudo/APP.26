name: Temporary Savant Export

on:
  push:
    paths:
      - 'tmp_savant_export.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet pandas requests
      - name: Export live Savant data
        run: python tmp_savant_export.py
      - name: Commit export to this temporary branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add savant_refresh_output || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Temporary live Savant export [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
