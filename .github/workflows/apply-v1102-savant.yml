name: Temporary Savant Attachment Export

on:
  push:
    paths:
      - 'attachment_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify downloadable CSVs
        run: |
          test -f savant_refresh_output/savant_batter_profiles.csv
          test -f savant_refresh_output/savant_pitcher_stats.csv
          test -f savant_refresh_output/pitch_mix_matchups.csv
      - name: Upload downloadable CSVs
        uses: actions/upload-artifact@v4
        with:
          name: savant-download-files
          path: |
            savant_refresh_output/savant_batter_profiles.csv
            savant_refresh_output/savant_pitcher_stats.csv
            savant_refresh_output/pitch_mix_matchups.csv
          if-no-files-found: error
          retention-days: 1
