name: ChatGPT Live Savant Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-savant-refresh.yml'
      - 'tools/chatgpt_refresh_savant.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests
      - name: Pull live Baseball Savant data and build installer files
        run: python tools/chatgpt_refresh_savant.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('savant_refresh_output')
          expected=['savant_batter_platoon_2026.csv','savant_batter_platoon_2026.last_good.csv','savant_refresh_manifest.json','savant_batter_profiles.csv','savant_batter_profiles.last_good.csv','savant_pitcher_stats.csv','savant_pitcher_stats.last_good.csv','pitch_mix_matchups.csv','pitch_mix_matchups.last_good.csv','savant_aux_refresh_manifest.json']
          for n in expected:
              p=root/n
              assert p.exists() and p.stat().st_size>20, f'missing/empty {n}'
          for n,minimum in [('savant_batter_platoon_2026.csv',400),('savant_batter_profiles.csv',400),('savant_pitcher_stats.csv',500),('pitch_mix_matchups.csv',1000)]:
              d=pd.read_csv(root/n)
              assert len(d)>=minimum, (n,len(d))
          print('validated', {n:(root/n).stat().st_size for n in expected})
          PY
      - name: Commit refreshed individual files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add savant_refresh_output
          if git diff --cached --quiet; then
            echo 'No output changes to commit'
          else
            git commit -m 'Refresh 2026 Baseball Savant installer files'
            git push origin HEAD:main
          fi
      - name: Upload refreshed files artifact
        uses: actions/upload-artifact@v4
        with:
          name: savant-refresh-individual-files
          path: savant_refresh_output/*
          if-no-files-found: error

# Triggered by ChatGPT on 2026-08-22 for a fresh live-data rebuild.
